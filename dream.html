<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꿈</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (진짜 오락실 픽셀 폰트: Press Start 2P) 및 한글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=DungGeunMo&amp;display=swap" rel="stylesheet">
    <style>
        /* 전역 레트로 폰트 및 분홍빛 은하수 배경 설정 */
        body {
            font-family: 'Press Start 2P', 'DungGeunMo', monospace;
            background: linear-gradient(135deg, #1f0b24 0%, #3a0d2f 35%, #59163c 70%, #200424 100%);
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
            cursor: default;
            line-height: 1.8;
        }

        /* 은하수 별빛 가루 효과 오버레이 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(pink, rgba(255,192,203,.15) 1px, transparent 30px),
                radial-gradient(rgba(255,105,180,0.4), transparent 60px);
            background-size: 550px 550px, 350px 350px, 450px 450px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
            pointer-events: none;
        }

        /* 폰트 크기 한층 더 대폭 확대 및 가독성 개선 */
        body, p, span, div {
            font-size: 1.3rem;
        }

        h1 {
            font-size: 2.3rem !important;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 1.8rem !important;
        }

        h3 {
            font-size: 1.5rem !important;
            line-height: 1.7 !important;
        }

        /* 레트로 스캔라인 및 네온 효과 */
        .arcade-box {
            border: 4px solid #ff3399;
            box-shadow: 0 0 18px rgba(255, 51, 153, 0.6), inset 0 0 15px rgba(255, 51, 153, 0.4);
            background: rgba(30, 8, 38, 0.85);
        }

        .arcade-button {
            border: 3px solid #ff77ff;
            box-shadow: 0 0 12px rgba(255, 119, 255, 0.6);
            transition: all 0.1s ease;
            font-family: 'Press Start 2P', 'DungGeunMo', monospace;
            font-size: 1.2rem;
            background-color: #2b0b38;
            color: #ffccff;
        }

        .arcade-button:hover {
            background-color: #ff77ff;
            color: #1f0b24;
            box-shadow: 0 0 25px #ff77ff;
            transform: translateY(-2px);
        }

        .arcade-button:active {
            transform: translateY(2px);
        }

        /* 카드 뒤집기 효과 */
        .flip-card {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #ff99cc;
            box-shadow: 0 0 12px rgba(255, 153, 204, 0.5);
            background: #280d38;
            padding: 1.2rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            background: #3c124e;
            color: #ffccff;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* 마우스 반짝이 효과 스타일 */
        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 16px;
            animation: sparkle-anim 0.8s linear forwards;
            z-index: 9999;
        }

        @keyframes sparkle-anim {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* 깜빡이는 애니메이션 */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .blink-text {
            animation: blink 1s infinite;
        }
    </style>
<style data-studio="css">

.st-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px}

.st-bar i{display:block;height:100%;width:0;background:var(--st-accent);transition:width .3s}
.st-cnt{font-size:.9rem;opacity:.75;margin:6px 0 0}
.st-dday,.st-timer{text-align:center;border-radius:20px;background:#f6f6f6;background:color-mix(in srgb,var(--st-accent) 10%,#fff)}
.st-dlabel,.st-tlabel{margin:0;font-weight:700;opacity:.8}
.st-dnum,.st-tnum{margin:4px 0 8px;font-size:3rem;font-weight:900;color:var(--st-accent);font-variant-numeric:tabular-nums;line-height:1.2}
.st-tnum.is-done{animation:stblink 1s 3}@keyframes stblink{50%{opacity:.2}}
.st-embed iframe{display:block;width:100%;aspect-ratio:16/9;height:auto;border:0;border-radius:14px}

.st-cols{display:grid;gap:16px}
.st-c2{grid-template-columns:repeat(2,minmax(0,1fr))}.st-c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:600px){.st-c2,.st-c3{grid-template-columns:1fr}}
.st-col{min-width:0}
html.st-dark{filter:invert(1) hue-rotate(180deg);background:#fff}
html.st-dark img,html.st-dark video,html.st-dark iframe,html.st-dark canvas{filter:invert(1) hue-rotate(180deg)}
.st-editing .st-tab-panel{display:block!important;outline:2px dashed rgba(0,0,0,.18);outline-offset:4px;margin:12px 0}

.st-editing dialog.st-modal{display:block;position:static;margin:12px auto;outline:2px dashed rgba(0,0,0,.25)}
